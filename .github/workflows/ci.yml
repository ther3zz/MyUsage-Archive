name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: library (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p ${{ matrix.python }} .venv
      - run: uv pip install -p .venv/bin/python -e ".[test]"
      - run: python scripts/vendor.py --check
      - run: .venv/bin/python -m pytest -q
      - run: uvx ruff check src tests custom_components tests_ha
      - run: .venv/bin/python -m mypy src

  integration:
    name: home assistant integration (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.14 .venv-ha
      - run: uv pip install -p .venv-ha/bin/python -e . -r requirements-ha-test.txt mypy
      - run: .venv-ha/bin/python -m pytest tests_ha -q -p no:cacheprovider
      - run: .venv-ha/bin/python -m mypy custom_components/myusage_archive --strict --ignore-missing-imports

  build:
    name: wheel excludes the component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: |
          python3 - <<'PY'
          import glob, zipfile, tarfile
          w = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          s = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          bad = [n for n in w + s if "custom_components" in n or "probes" in n]
          assert not bad, bad
          print("distribution clean")
          PY
