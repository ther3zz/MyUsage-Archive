[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myusage-archive"
version = "0.1.0"
description = "Unofficial archiver for Exceleron MyUsage utility portals (OUC): durable local capture of 15-minute electric interval data. Not affiliated with Exceleron Software or OUC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ther3zz" }]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.11"]

[project.scripts]
myusage-archive = "myusage_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# The Home Assistant custom component lives in custom_components/ in this same
# repository but is NOT part of the PyPI distribution (see MANIFEST.in). The
# integration depends on the published library through its manifest pin.

[tool.setuptools.package-data]
myusage_archive = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]   # makes custom_components importable in tests
markers = [
    "network: hits the live MyUsage portal; excluded from the default run",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["custom_components/myusage_archive/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20", "RET", "SIM"]
ignore = ["S101"]  # asserts in tests

[tool.ruff.lint.per-file-ignores]
"src/myusage_archive/cli.py" = ["T20"]   # CLI prints by design
"src/myusage_archive/probe.py" = ["T20"]
"scripts/*.py" = ["T20"]     # sync script prints by design

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["myusage_archive"]
